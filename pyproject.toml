[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "high-vs-low-paper"
version = "0.1.0"
description = "Paper-only MEXC cross-sectional ATH/ATL proximity strategy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["websocket-client>=1.8,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
high-low-paper = "high_vs_low.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
